name: Deploy Band Director

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        
      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/hermes-fleet || exit 1
            
            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            
            echo "Writing environment variables..."
            cat > .env << 'ENVFILE'
            KIMI_API_KEY=${{ secrets.KIMI_API_KEY }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            FIRECRAWL_API_URL=http://firecrawl-api:3002
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            ENVFILE
            
            echo "Restarting services..."
            docker compose pull
            docker compose up -d --build
            
            echo "Waiting for healthcheck..."
            for i in {1..60}; do
              if docker compose ps | grep -q "healthy"; then
                echo "Services are healthy"
                break
              fi
              sleep 5
            done
            
            echo "Container status:"
            docker compose ps
            
            echo "Recent logs:"
            docker compose logs --tail=50
          EOF
          
      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST "docker compose -f /opt/hermes-fleet/docker-compose.yml ps | grep -q 'healthy' || exit 1"
          echo "Deployment verified successfully"
          
      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check VPS logs."
