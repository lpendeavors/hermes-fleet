name: Deploy Band Director

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d477e20d10a51b02e  # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          
      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts
          
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/hermes-fleet || exit 1
            
            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            
            echo "Writing environment variables..."
            cat > .env << 'ENVFILE'
            KIMI_API_KEY=${{ secrets.KIMI_API_KEY }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            ENVFILE
            
            echo "Restarting services..."
            docker compose pull
            docker compose up -d --build
            
            echo "Waiting for healthcheck..."
            for i in {1..30}; do
              if docker compose ps | grep -q "healthy"; then
                echo "Container is healthy"
                break
              fi
              sleep 2
            done
            
            echo "Container status:"
            docker compose ps
            
            echo "Recent logs:"
            docker compose logs --tail=50
          EOF
          
      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST "docker compose -f /opt/hermes-fleet/docker-compose.yml ps | grep -q 'healthy' || exit 1"
          echo "Deployment verified successfully"
          
      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check VPS logs."
