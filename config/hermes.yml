# Band Director - Core Hermes Configuration
agent:
  name: "Band Director"
  version: "1.0.0"

# LLM Provider - Kimi (Moonshot AI)
provider:
  name: "kimi"
  api_key: "${KIMI_API_KEY}"
  base_url: "https://api.moonshot.cn/v1"
  model: "kimi-latest"
  temperature: 0.7
  max_tokens: 4096

# Memory System
memory:
  enabled: true
  engine: "sqlite"
  path: "/app/data/memory.db"
  fts5:
    enabled: true
  periodic_nudges:
    enabled: true
    interval_hours: 24
  honcho:
    enabled: false

# Learning Loop
learning:
  skill_creation:
    enabled: true
  skill_improvement:
    enabled: true
  auto_save_skills: true

# Security
security:
  command_approval:
    enabled: true
    destructive_requires_approval: true
  container_isolation:
    enabled: true

# Logging
logging:
  level: "INFO"
  path: "/app/data/logs"
  max_size_mb: 100
  max_files: 5
