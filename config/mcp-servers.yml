# MCP (Model Context Protocol) Server Integrations
mcp:
  enabled: true
  servers:
    firecrawl:
      name: "firecrawl"
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "firecrawl-mcp"
      env:
        FIRECRAWL_API_KEY: "firecrawl-local-api-key"
        FIRECRAWL_API_URL: "http://firecrawl-api:3002"

    playwright:
      name: "playwright"
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "@anthropic-ai/playwright-mcp"
