services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: band-director
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HERMES_CONFIG_DIR=/app/config
      - HERMES_DATA_DIR=/app/data
      - HERMES_SKILLS_DIR=/app/skills
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
      - hermes-data:/app/data
    networks:
      - hermes-net
    depends_on:
      firecrawl-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "hermes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Firecrawl Self-Hosted Stack
  redis:
    image: redis:7-alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: firecrawl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=firecrawl
      - POSTGRES_PASSWORD=firecrawl
      - POSTGRES_DB=firecrawl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl -d firecrawl"]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright-service:
    image: browserless/chrome:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=20
      - ENABLE_CORS=true
      - EXIT_ON_HEALTH_FAILURE=true
      - PREBOOT_CHROME=true
      - KEEP_ALIVE=true
      - FUNCTION_ENABLE_INCOGNITO_MODE=true
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000 pressure"]
      interval: 10s
      timeout: 5s
      retries: 5

  firecrawl-api:
    image: mendableai/firecrawl:latest
    container_name: firecrawl-api
    restart: unless-stopped
    command: ["pnpm", "run", "start:api"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - PORT=3002
      - NUM_WORKERS_PER_QUEUE=1
      - BULL_AUTH_KEY=firecrawl-local-auth-key
      - TEST_API_KEY=firecrawl-local-api-key
      - SUPABASE_ANON_TOKEN=
      - SUPABASE_URL=
      - SUPABASE_SERVICE_TOKEN=
      - OPENAI_API_KEY=${KIMI_API_KEY}
      - OPENAI_BASE_URL=https://api.moonshot.cn/v1
      - OPENAI_MODEL=kimi-latest
      - SCRAPING_BEE_API_KEY=
      - SELF_HOSTED_WEBHOOK_VERIFICATION_TOKEN=
      - POSTHOG_API_KEY=
      - POSTHOG_HOST=
      - ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  firecrawl-worker:
    image: mendableai/firecrawl:latest
    container_name: firecrawl-worker
    restart: unless-stopped
    command: ["pnpm", "run", "workers"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - PORT=3002
      - NUM_WORKERS_PER_QUEUE=1
      - BULL_AUTH_KEY=firecrawl-local-auth-key
      - TEST_API_KEY=firecrawl-local-api-key
      - SUPABASE_ANON_TOKEN=
      - SUPABASE_URL=
      - SUPABASE_SERVICE_TOKEN=
      - OPENAI_API_KEY=${KIMI_API_KEY}
      - OPENAI_BASE_URL=https://api.moonshot.cn/v1
      - OPENAI_MODEL=kimi-latest
      - SCRAPING_BEE_API_KEY=
      - SELF_HOSTED_WEBHOOK_VERIFICATION_TOKEN=
      - POSTHOG_API_KEY=
      - POSTHOG_HOST=
      - ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
      firecrawl-api:
        condition: service_healthy
    networks:
      - hermes-net

volumes:
  hermes-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  hermes-net:
    driver: bridge
