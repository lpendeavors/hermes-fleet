services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: band-director
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HERMES_CONFIG_DIR=/app/config
      - HERMES_DATA_DIR=/app/data
      - HERMES_SKILLS_DIR=/app/skills
      - FIRECRAWL_API_URL=http://firecrawl-api:3002
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
      - hermes-data:/app/data
    networks:
      - hermes-net
    depends_on:
      firecrawl-api:
        condition: service_started
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "sleep"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Firecrawl Self-Hosted Stack
  redis:
    image: redis:7-alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      - PORT=3000
      - MAX_CONCURRENT_PAGES=10
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    deploy:
      restart_policy:
        condition: on-failure

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - PORT=3002
      - NUM_WORKERS_PER_QUEUE=1
      - BULL_AUTH_KEY=firecrawl-local-auth-key
      - TEST_API_KEY=firecrawl-local-api-key
      - OPENAI_API_KEY=${KIMI_API_KEY}
      - OPENAI_BASE_URL=https://api.moonshot.cn/v1
      - MODEL_NAME=kimi-latest
      - ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      playwright-service:
        condition: service_started
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hermes-data:
    driver: local
  redis-data:
    driver: local

networks:
  hermes-net:
    driver: bridge
